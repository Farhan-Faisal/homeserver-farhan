server {
    listen 80;
    server_name dash.farhanlab.com;

    # Don't serve files here: hand everything (the page and /api) to the serverdash
    # nginx on the host, port 8090, so both doors (Cloudflare and Tailscale) get the
    # exact same thing. Cloudflare's headers, including its login token, pass through.
    location / {
        proxy_pass http://host.docker.internal:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
