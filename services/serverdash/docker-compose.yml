services:
  serverdash:
    image: nginx:1.27-alpine
    container_name: serverdash
    network_mode: host
    volumes:
      - /opt/serverdash/www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./allowed-networks.conf:/etc/nginx/allowed-networks.conf:ro
    restart: unless-stopped
