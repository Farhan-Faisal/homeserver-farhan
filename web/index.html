<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='5' rx='1.5' fill='%232a78d6'/%3E%3Crect x='2' y='9' width='12' height='5' rx='1.5' fill='%232a78d6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="host">Server</h1>
      <span id="overall"></span>
    </div>
    <div class="meta" id="meta">Loading…</div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Chart time range">
        <button type="button" data-range="short" aria-pressed="true">1 hour</button>
        <button type="button" data-range="long" aria-pressed="false">24 hours</button>
      </div>
      <button type="button" class="btn" id="theme" aria-label="Color theme">Theme: auto</button>
    </div>
  </header>
  <nav class="jump" aria-label="Sections">
    <a href="#overview">Overview</a><a href="#people">People</a><a href="#storage">Storage</a>
    <a href="#services">Services</a><a href="#hardware">Hardware</a>
  </nav>
  <div id="banner"></div>
  <main id="main">
    <section id="overview">
      <div id="alerts"></div>
      <div class="grid g-tiles" id="tiles"></div>
      <div class="grid g-charts mt-12" id="charts"></div>
    </section>
    <section id="people"></section>
    <section id="storage"></section>
    <section id="services"></section>
    <section id="hardware"></section>
  </main>
  <footer id="footer"></footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>
</body>
</html>
