# Jellyfin media server. All settings are in .env (copy .env.example).
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${PUID}:${PGID}"          # run as your user, not root
    group_add:
      - "${RENDER_GID}"              # Intel GPU access for transcoding (delete if no Intel GPU)
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128   # the Intel GPU (delete if no Intel GPU)
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config             # Jellyfin's settings and database
      - ./cache:/cache               # artwork and transcoding scratch space
      - ${MEDIA_DIR}:/media:ro       # your media, read-only: Jellyfin never changes your files
    environment:
      - TZ=${TZ}
    restart: unless-stopped
