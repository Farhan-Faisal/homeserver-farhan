# Who may open the dashboard. install.sh copies this file only once,
# so your edits survive reinstalls. After editing:
#   cd ~/stacks/serverdash && docker compose restart

allow 127.0.0.1;                # the server itself
allow ::1;
allow 100.64.0.0/10;            # Tailscale devices (IPv4)
allow fd7a:115c:a1e0::/48;      # Tailscale devices (IPv6)
# allow 192.168.0.0/16;         # uncomment for devices on your home network
