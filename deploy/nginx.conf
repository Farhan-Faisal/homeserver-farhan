# Dashboard web server. Runs on the host network so it sees real client IPs,
# then only answers the networks listed in allowed-networks.conf.
server {
    listen 8090;
    listen [::]:8090;

    include /etc/nginx/allowed-networks.conf;  # who may open the page (yours to edit)
    deny all;                                  # everyone else

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Next.js puts small scripts inline in each page, and the bars and charts use inline styles.
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";

    # The API
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Built JS, CSS and fonts. Their names change whenever their content does, so cache them for good.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Pages: /people is people.html. Browsers must check for a new one on every visit.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy $csp always;
    }

    error_page 404 /404.html;
}
