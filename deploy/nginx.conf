# Dashboard web server. Runs on the host network so it sees real client IPs,
# then only answers the networks listed in allowed-networks.conf.
server {
    listen 8090;
    listen [::]:8090;

    include /etc/nginx/allowed-networks.conf;  # who may open the page (yours to edit)
    deny all;                                  # everyone else

    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    # Strict CSP: no inline scripts or styles anywhere (the page only loads its own files).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /status.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # JS/CSS change on every install; make browsers revalidate instead of caching stale modules.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'" always;
    }
    location / {
        try_files $uri /index.html;
    }
}
